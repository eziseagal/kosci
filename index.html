<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Gra w Kości – karta punktów</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<h1 style="font-size: 2.5em; margin: 20px 0;">🎲 Gra w Kości</h1>

<div id="start" style="font-size: 1.2em;">
  <div id="etap-liczba">
    <h2>Liczba graczy</h2>
    <div class="gracz-selector" id="liczba-graczy-buttons"></div>
  </div>
  
  <div id="etap-nazwy" style="display:none;">
    <h2>Nazwy graczy</h2>
    <div id="nazwa-inputs"></div>
    <button onclick="validateAndProceedToStart()">Dalej</button>
  </div>
  
  <div id="etap-start" style="display:none;">
    <h2>Gracz startowy</h2>
    <div id="gracz-startowy"></div>
    <button onclick="startGry()">Rozpocznij grę</button>
  </div>
</div>

<div id="games-counter-top" style="position: fixed; top: 8px; left: 8px; z-index: 2200; padding: 11px 16px; background: linear-gradient(135deg, #2196f3 0%, #1976d2 100%); color: white; border-radius: 6px; font-weight: bold; white-space: nowrap; box-shadow: 0 4px 12px rgba(33, 150, 243, 0.3);">🎮 Partie: <span id="total-games-counter">0</span></div>

<p id="tura" style="font-size: 1.3em; font-weight: bold; color: #2c3e50; margin: 20px 0;"></p>

<p id="partia-nr" style="font-size: 1.1em; font-weight: 600; color: #1976d2; margin: 5px 0 20px 0;"></p>

<div id="controls">
  <button id="btnUndo">Cofnij</button>
  <button id="btnNewGame">Nowa gra</button>
  <button id="btnStats">Historia rozgrywek</button>
</div>

<div class="layout">
  <div class="table-wrapper">
    <table id="tabela">
      <tr>
        <th>Pole</th>
      </tr>
    </table>
  </div>

  <div id="panel">
    <h3>Wybór punktów</h3>
    <p id="opis"></p>
    <div id="opcje"></div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
